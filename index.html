<title>Journey</title>
<style>
:root{
  --bg:#f5f5f7; --bg2:#ffffff; --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --line:rgba(0,0,0,.08);
  --glass-bg:rgba(255,255,255,.5); --glass-hi:rgba(255,255,255,.95); --glass-lo:rgba(255,255,255,.3);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.25), 0 1px 2px rgba(0,0,0,.04), 0 18px 50px -14px rgba(0,0,0,.2);
  --spec:rgba(255,255,255,.6);
  --accent:#0071e3; --accent-h:#0077ed;
  --stage-a:#f0f2f7; --stage-b:#dde2ec;
  --map-fill:rgba(20,24,40,.075); --map-stroke:rgba(20,24,40,.22); --grid:rgba(20,24,40,.06); --label:rgba(29,29,31,.42);
  --blob1:#c9b6ff; --blob2:#9ed4ff; --blob3:#ffe08f; --blob-op:.55;
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000; --bg2:#0a0a0c; --fg:#f5f5f7; --fg2:#a1a1a6; --fg3:#6e6e73; --line:rgba(255,255,255,.1);
    --glass-bg:rgba(36,36,42,.36); --glass-hi:rgba(255,255,255,.34); --glass-lo:rgba(255,255,255,.05);
    --glass-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.04), 0 18px 50px -14px rgba(0,0,0,.7);
    --spec:rgba(255,255,255,.17); --accent:#0a84ff; --accent-h:#2997ff;
    --stage-a:#0e1018; --stage-b:#030406;
    --map-fill:rgba(255,255,255,.075); --map-stroke:rgba(255,255,255,.24); --grid:rgba(255,255,255,.045); --label:rgba(245,245,247,.4);
    --blob1:#4b2fd0; --blob2:#0a52c9; --blob3:#9a6b00; --blob-op:.34;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --bg2:#0a0a0c; --fg:#f5f5f7; --fg2:#a1a1a6; --fg3:#6e6e73; --line:rgba(255,255,255,.1);
  --glass-bg:rgba(36,36,42,.36); --glass-hi:rgba(255,255,255,.34); --glass-lo:rgba(255,255,255,.05);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.04), 0 18px 50px -14px rgba(0,0,0,.7);
  --spec:rgba(255,255,255,.17); --accent:#0a84ff; --accent-h:#2997ff;
  --stage-a:#0e1018; --stage-b:#030406;
  --map-fill:rgba(255,255,255,.075); --map-stroke:rgba(255,255,255,.24); --grid:rgba(255,255,255,.045); --label:rgba(245,245,247,.4);
  --blob1:#4b2fd0; --blob2:#0a52c9; --blob3:#9a6b00; --blob-op:.34;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.01em}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ambient light */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient i{position:absolute;width:52vmax;height:52vmax;border-radius:50%;filter:blur(90px);opacity:var(--blob-op);will-change:transform}
.ambient i:nth-child(1){background:var(--blob1);top:-18vmax;left:-12vmax;animation:drift1 26s ease-in-out infinite alternate}
.ambient i:nth-child(2){background:var(--blob2);top:10vmax;right:-20vmax;animation:drift2 32s ease-in-out infinite alternate}
.ambient i:nth-child(3){background:var(--blob3);bottom:-26vmax;left:22vw;animation:drift1 38s ease-in-out infinite alternate-reverse;opacity:calc(var(--blob-op)*.7)}
@keyframes drift1{to{transform:translate(12vmax,8vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-14vmax,10vmax) scale(.9)}}

/* liquid glass */
.glass{
  --mx:50%;--my:0%;
  position:relative;isolation:isolate;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  backdrop-filter:blur(26px) saturate(190%);
  box-shadow:var(--glass-shadow);
  border-radius:var(--r,22px);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(150deg,var(--glass-hi),var(--glass-lo) 32%,transparent 55%,var(--glass-lo) 78%,var(--glass-hi));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(140px 140px at var(--mx) var(--my),var(--spec),transparent 70%),
             linear-gradient(180deg,var(--spec),transparent 42%);
  opacity:.75;transition:opacity .4s var(--ease);
}

/* nav */
.nav{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:14px;padding:7px 7px 7px 18px;--r:999px;width:min(760px,calc(100% - 24px))}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.02em;white-space:nowrap}
.brand svg{width:22px;height:22px}
.nav-stats{display:flex;gap:16px;margin-left:auto;font-size:12.5px;color:var(--fg2);white-space:nowrap}
.nav-stats b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;margin-right:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .25s var(--ease),background .2s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-primary:hover{background:var(--accent-h)}
.btn svg{width:16px;height:16px}

/* hero */
.hero{text-align:center;padding:calc(env(safe-area-inset-top,0px) + 132px) 24px 40px;max-width:980px;margin:0 auto}
.hero h1{margin:0;font-size:clamp(44px,8.2vw,96px);line-height:1.02;font-weight:800;letter-spacing:-.045em;
  background:linear-gradient(100deg,var(--fg) 0%,var(--fg) 30%,#8a6cff 52%,#2b9bff 68%,#ffb340 88%);
  -webkit-background-clip:text;background-clip:text;color:transparent;background-size:220% 100%;background-position:100% 0;
  animation:sheen 2.6s .25s var(--ease) both}
@keyframes sheen{from{background-position:100% 0;opacity:0;transform:translateY(18px)}to{background-position:0 0;opacity:1;transform:none}}
.hero-sub{margin:18px auto 0;font-size:clamp(17px,2vw,21px);color:var(--fg2);font-weight:500;max-width:30ch;line-height:1.45;animation:rise 1s .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* stage */
.stage-wrap{padding:0 clamp(12px,3vw,40px);max-width:1440px;margin:0 auto;animation:stageIn 1.3s .45s var(--ease) both}
@keyframes stageIn{from{opacity:0;transform:scale(.96) translateY(30px)}to{opacity:1;transform:none}}
.stage{position:relative;height:min(76vh,860px);min-height:460px;border-radius:34px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,var(--stage-a),var(--stage-b));
  box-shadow:0 40px 100px -40px rgba(0,0,0,.45),inset 0 0 0 1px var(--line)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#map.dragging{cursor:grabbing}
#map.pointing{cursor:pointer}

.legend{position:absolute;top:18px;left:18px;width:236px;max-height:calc(100% - 36px);display:flex;flex-direction:column;padding:14px 10px 10px;--r:24px;z-index:3}
.legend h3{margin:0 8px 10px;font-size:13px;font-weight:600;color:var(--fg2);display:flex;justify-content:space-between}
.legend h3 button{font-size:12px;color:var(--accent);font-weight:600;visibility:hidden}
.legend h3 button.on{visibility:visible}
.chips{overflow:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;font-size:14px;font-weight:500;text-align:left;transition:background .2s,opacity .3s}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent),0 0 12px var(--c);flex:none}
.chip span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-weight:600;font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums}
.chip:hover{background:color-mix(in srgb,var(--c) 14%,transparent)}
.chip.active{background:color-mix(in srgb,var(--c) 22%,transparent)}
.chips.filtering .chip:not(.active){opacity:.45}
.chip-sep{font-size:11.5px;color:var(--fg3);margin:10px 10px 4px;font-weight:600}
.chip-empty{font-size:13px;color:var(--fg3);padding:4px 10px 6px}

.ctrls{position:absolute;top:18px;right:18px;display:flex;flex-direction:column;gap:10px;z-index:3}
.ctrl-group{display:flex;flex-direction:column;--r:22px;overflow:hidden}
.ic{width:44px;height:44px;display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.ic:hover{background:rgba(127,127,127,.12)}
.ic:active{transform:scale(.9)}
.ic svg{width:18px;height:18px}
.ic.solo{border-radius:50%;--r:50%}
.ctrl-group .ic+.ic{border-top:1px solid var(--line)}
.ic.playing svg.p{display:none}
.ic:not(.playing) svg.s{display:none}

.now{position:absolute;left:50%;bottom:22px;transform:translate(-50%,24px) scale(.96);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;--r:999px;z-index:3;transition:opacity .5s var(--ease),transform .6s var(--ease);min-width:240px}
.now.show{opacity:1;transform:translate(-50%,0) scale(1)}
.now .th{width:46px;height:46px;border-radius:50%;background:var(--c) center/cover;flex:none;box-shadow:0 0 0 2px var(--c)}
.now .tx{display:flex;flex-direction:column;gap:2px}
.now .tx strong{font-size:15px;font-weight:600}
.now .tx span{font-size:12.5px;color:var(--fg2)}
.now .bar{position:absolute;left:24px;right:24px;bottom:-1px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.now .bar i{display:block;height:100%;width:0;background:var(--c)}

.tip{position:absolute;z-index:4;pointer-events:none;display:flex;gap:10px;align-items:center;padding:6px 14px 6px 6px;--r:18px;
  opacity:0;transform:translate(-50%,calc(-100% - 6px)) scale(.94);transition:opacity .18s,transform .25s var(--ease);white-space:nowrap}
.tip.show{opacity:1;transform:translate(-50%,calc(-100% - 16px)) scale(1)}
.tip .th{width:52px;height:52px;border-radius:12px;background:var(--c) center/cover;flex:none}
.tip strong{display:block;font-size:14px;font-weight:600}
.tip span{display:block;font-size:12px;color:var(--fg2);margin-top:2px}

.empty{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;transition:opacity .5s}
.empty.hide{opacity:0}
.empty .card{pointer-events:auto;text-align:center;padding:34px 40px 30px;--r:32px;max-width:min(380px,calc(100% - 40px))}
.empty .disc{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(from 200deg,#bf5af2,#0a84ff,#30d158,#ffd60a,#ff9f0a,#ff375f,#bf5af2);animation:spin 9s linear infinite;position:relative}
.empty .disc::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg2)}
.empty .disc svg{width:32px;height:32px;position:relative;z-index:1;animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.empty h2{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-.025em}
.empty p{margin:0 0 20px;color:var(--fg2);font-size:15px}
.nogps{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);padding:9px 16px;--r:999px;font-size:13px;color:var(--fg2);z-index:2;display:none}
.nogps.show{display:block}

/* sections */
.section{max-width:1240px;margin:0 auto;padding:110px clamp(16px,4vw,40px) 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:clamp(30px,4.4vw,48px);font-weight:700;letter-spacing:-.035em;line-height:1.05}

.insights{display:grid;grid-template-columns:1.25fr 1.25fr 1fr;gap:16px}
.ins{padding:26px 26px 24px;--r:28px;min-height:250px;display:flex;flex-direction:column}
.ins h4{margin:0 0 18px;font-size:14px;font-weight:600;color:var(--fg2)}
.ins .big{font-size:clamp(34px,4vw,46px);font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.ins .big small{font-size:.42em;font-weight:600;color:var(--fg2);margin-left:4px;letter-spacing:-.01em}
.rows{display:flex;flex-direction:column;gap:13px}
.row .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;gap:10px}
.row .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l b{font-weight:600;color:var(--fg2);font-variant-numeric:tabular-nums}
.row .t{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.row .t i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#5e5ce6,#0a84ff);transform-origin:left;transform:scaleX(0);transition:transform 1.1s var(--ease)}
.hist{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:auto}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.hist i{width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#ffd60a,#ff9f0a);min-height:4px;transform-origin:bottom;transform:scaleY(0);transition:transform 1s var(--ease)}
.hist span{font-size:11.5px;color:var(--fg2);white-space:nowrap}
.ins-span{grid-column:1/-1;flex-direction:row;align-items:center;gap:clamp(20px,5vw,72px);min-height:0;flex-wrap:wrap}
.ins-span .kv h4{margin-bottom:10px}
.ins-empty{color:var(--fg3);font-size:14px}

.seg{display:inline-flex;padding:4px;--r:999px;position:relative}
.seg button{position:relative;z-index:1;height:34px;padding:0 18px;font-size:14px;font-weight:600;color:var(--fg2);border-radius:999px;transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--bg2);box-shadow:0 2px 10px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .45s var(--ease),width .45s var(--ease)}

.group{margin-bottom:40px}
.group-h{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:17px;font-weight:600;letter-spacing:-.02em}
.group-h i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.group-h small{font-size:13px;color:var(--fg3);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{position:relative;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:color-mix(in srgb,var(--c) 30%,var(--bg2));cursor:pointer;
  transform:translateZ(0);transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.card:hover{transform:translateY(-4px);box-shadow:0 22px 40px -18px rgba(0,0,0,.45)}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.card:hover img{transform:scale(1.04)}
.card .ph{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}
.card .ph svg{width:34px;height:34px;color:rgba(255,255,255,.85)}
.card .meta{position:absolute;left:8px;right:8px;bottom:8px;padding:9px 12px;--r:16px;
  --glass-bg:rgba(20,20,24,.32);--glass-hi:rgba(255,255,255,.5);--glass-lo:rgba(255,255,255,.08);--spec:rgba(255,255,255,.18);color:#fff}
.card .meta .r{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600}
.card .meta .r i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.card .meta .s{font-size:11.5px;opacity:.82;margin-top:3px;display:flex;justify-content:space-between;gap:6px}
.card .meta .s span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.pop{animation:pop .7s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.gallery-empty{color:var(--fg3);font-size:15px;padding:30px 0}

footer{max-width:1240px;margin:120px auto 0;padding:24px clamp(16px,4vw,40px) 40px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--fg3)}
.sec-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn-reset{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:600;color:#fff;
  background:#ff3b30;box-shadow:0 8px 22px -8px rgba(255,59,48,.65),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .25s var(--ease),background .2s,opacity .3s}
.btn-reset svg{width:16px;height:16px}
.btn-reset:hover{background:#ff2d20}
.btn-reset:active{transform:scale(.96)}
.btn-reset:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn-reset:disabled:active{transform:none}

/* sheet */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.36);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:81;left:50%;top:50%;width:min(980px,calc(100% - 28px));max-height:calc(100% - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  transform:translate(-50%,-46%) scale(.94);opacity:0;pointer-events:none;transition:opacity .4s var(--ease),transform .55s var(--ease);
  display:grid;grid-template-columns:1.25fr 1fr;--r:34px;overflow:hidden}
.sheet.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.sheet .img{background:#000;display:grid;place-items:center;min-height:320px;position:relative}
.sheet .img img{max-height:78vh;width:100%;height:100%;object-fit:contain}
.sheet .img .ph{width:100%;height:100%;min-height:360px;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}
.sheet .img .ph svg{width:48px;height:48px;color:rgba(255,255,255,.85)}

      x += px; y += py; px = x; py = y; r.push([x/sc, y/sc]);

    return r;

  json.features.forEach(f => {
    const g = f.geometry; if (!g) return; const eo = g.encodeOffsets;

      if (g.type === 'Polygon' && Array.isArray(g.coordinates)) g.coordinates = g.coordinates.map((ring, i) => D(ring, eo && eo[i]));

function inPoly(x, y, poly){
  let ins = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}

  const x = ax + t*dx - px, y = ay + t*dy - py; return Math.hypot(x, y);
}
function countryAt(lat, lon){
  for (const c of GEO.countries){
    if (!inBox(lat, lon, c.bb)) continue;
    for (let i = 0; i < c.polys.length; i++){
      if (!inBox(lat, lon, c.pbb[i])) continue;
      let ins = false; for (const ring of c.polys[i]) if (inPoly(lon, lat, ring)) ins = !ins;
      if (ins) return c;
    }
  }
  // 해안·바다 위에서 찍은 사진: 가장 가까운 국가 (0.6° 이내)
  let best = null, bd = .6; const k = Math.cos(lat*D2R), M = .6;
  for (const c of GEO.countries){
    const b = c.bb; if (lon < b[0]-M || lon > b[2]+M || lat < b[1]-M || lat > b[3]+M) continue;
    for (const poly of c.polys){
      const ring = poly[0];
      for (let i = 0; i < ring.length; i++){
        const a = ring[i], z = ring[(i + 1) % ring.length];
        const d = segDist(lon*k, lat, a[0]*k, a[1], z[0]*k, z[1]); if (d < bd){ bd = d; best = c; }
      }
    }
  }

}
function krProvince(lat, lon){
  for (const r of KR) if (r.polys.some(p => inPoly(lon, lat, p))) return r;
  let best = null, bd = .9;
  for (const r of KR) for (const p of r.polys) for (let i = 0; i < p.length; i++){
    const a = p[i], b = p[(i+1) % p.length];
    const d = segDist(lon*.8, lat, a[0]*.8, a[1], b[0]*.8, b[1]); if (d < bd){ bd = d; best = r; }

function classify(lat, lon){
  if (lat == null || lon == null) return NONE;
  for (const [code, b] of TINY) if (inBox(lat, lon, b)) return countryReg(code);
  if (!nearKorea(lat, lon) && lon > 129.15 && lon < 129.55 && lat > 34.05 && lat < 34.75) return countryReg('JP');
  if (GEO.ready){
    const c = countryAt(lat, lon);
    if (c && c.code !== 'KR') return countryReg(c.code, c.ko);
    if (c || nearKorea(lat, lon)){ const p = krProvince(lat, lon); if (p) return p; if (c) return countryReg('KR'); }
    return ABROAD;
  }
  if (nearKorea(lat, lon)){ const p = krProvince(lat, lon); if (p) return p; }
  for (const [code, b] of BOXES) if (inBox(lat, lon, b)) return countryReg(code);
  return ABROAD;
}

const idb = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const DB = {
  db: null,
  async open(){
    try{
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('photo-journey', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('photos', {keyPath:'id'});
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    }catch(e){ this.db = null; }
  },
  st(m){ return this.db.transaction('photos', m).objectStore('photos'); },
  async all(){
    if (!this.db) return [];
    try{
      const rows = await idb(this.st('readonly').getAll());
      const ok = [];
      for (const r of rows){
        if (!r || typeof r.id !== 'string' || !/^[a-z0-9]{1,40}$/i.test(r.id) || !isFinite(r.takenAt)) continue;

        ok.push(r);

      return ok;
    }catch(e){ return []; }
  },
  async put(p){
    if (!this.db) return;
    const rec = {...p}; if (rec.thumbBlob) delete rec.thumb;
    try{ await idb(this.st('readwrite').put(rec)); }catch(e){}
  },
  async del(id){ if (!this.db) return; try{ await idb(this.st('readwrite').delete(id)); }catch(e){} },

const EXT = f => ((f.name || '').match(/\.([a-z0-9]+)$/i) || [, ''])[1].toLowerCase();

  const e = EXT(f);

async function sniff(file){
  try{
    const h = new Uint8Array(await file.slice(0, 16).arrayBuffer());
    const s = String.fromCharCode(...h.slice(4, 12));
    if (h[0] === 0xFF && h[1] === 0xD8) return 'jpeg';
    if (s.startsWith('ftyp')){
      const b = s.slice(4);
      if (/^(hei|hev|mif1|msf1)/.test(b)) return 'heif';
      if (/^avi/.test(b)) return 'avif';
      if (/^crx/.test(b)) return 'cr3';
      return 'bmff';
    }
    if ((h[0] === 0x49 && h[1] === 0x49) || (h[0] === 0x4D && h[1] === 0x4D)) return 'tiff';
    if (s.startsWith('UJI')) return 'raf';
    return 'other';
  }catch(e){ return 'other'; }
}

/* ───────── UI 렌더 ───────── */
function countUp(el, to, dec = 0){
  const from = parseFloat(el.dataset.v || '0'); el.dataset.v = to;
  const t0 = performance.now(), dur = reduced ? 1 : 900;
  const f = n => n.toLocaleString('ko-KR', {maximumFractionDigits:dec, minimumFractionDigits:0});
  const step = t => { const k = clamp((t - t0)/dur, 0, 1), e = 1 - Math.pow(1-k, 3); el.textContent = f(from + (to - from)*e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function totalKm(){ let s = 0; for (let i = 1; i < S.geo.length; i++) s += hav(S.geo[i-1], S.geo[i]); return s; }

function renderStats(){
  const regs = new Set(S.photos.map(p => p.region).filter(k => k !== 'none'));
  countUp($('#nPhotos'), S.photos.length); countUp($('#nRegions'), regs.size);
  const km = totalKm(); countUp($('#nKm'), km < 10 ? Math.round(km*10)/10 : Math.round(km), km < 10 ? 1 : 0);
}
function regionOrder(){
  const seen = new Map();
  S.photos.forEach(p => { if (!seen.has(p.region)) seen.set(p.region, 0); seen.set(p.region, seen.get(p.region) + 1); });
  return [...seen.entries()];
}
function renderLegend(){
  const box = $('#chips'), ord = regionOrder();
  const kr = ord.filter(([k]) => reg(k).group === 'kr'), intl = ord.filter(([k]) => reg(k).group === 'intl'), none = ord.filter(([k]) => k === 'none');
  const chip = ([k, n]) => { const r = reg(k); return `<button type="button" class="chip${S.filter === k ? ' active' : ''}" data-k="${k}" style="--c:${r.color}" aria-pressed="${S.filter === k}"><i></i><span>${esc(r.full || r.name)}</span><b>${n}</b></button>`; };
  let h = '';
  if (!ord.length) h = '<div class="chip-empty">사진을 추가하면 지역별로 분류됩니다</div>';
  if (kr.length) h += (intl.length ? '<div class="chip-sep" style="margin-top:0">국내</div>' : '') + kr.map(chip).join('');
  if (intl.length) h += '<div class="chip-sep">해외</div>' + intl.map(chip).join('');
  if (none.length) h += (kr.length || intl.length ? '<div class="chip-sep">기타</div>' : '') + none.map(chip).join('');
  box.innerHTML = h; box.classList.toggle('filtering', !!S.filter);
  $('#clearFilter').classList.toggle('on', !!S.filter);
}
function topList(arr, n = 4){
  const m = new Map(); arr.filter(Boolean).forEach(v => m.set(v, (m.get(v) || 0) + 1));
  return [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, n);
}
function rowsHTML(list){

}

      ${row('좌표', p.lat != null ? `${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}` : null, 1)}
      ${row('고도', p.alt != null ? Math.round(p.alt) + 'm' : null)}
      ${row('해상도', p.w && p.h ? `${p.w} × ${p.h}` : null)}
      ${row('파일', p.name, 1)}
    </dl>
    <div class="acts">
      ${p.lat != null ? '<button class="btn btn-primary" type="button" id="goMap">지도에서 보기</button>' : ''}
      <button class="btn btn-ghost btn-danger" type="button" id="delPhoto">삭제</button>
    </div>`;
  $('#scrim').classList.add('show'); sh.classList.add('show'); document.body.style.overflow = 'hidden';
  setTimeout(() => $('#closeSheet').focus(), 50);
  const go = $('#goMap');
  if (go) go.onclick = () => { closeSheet(); const q = Stage.pts.find(q => q.p.id === id); $('#stageSec').scrollIntoView({behavior: reduced ? 'auto' : 'smooth', block:'center'}); if (q) setTimeout(() => { Stage.focus(q); Stage.setHover(Stage.pts.indexOf(q)); }, 350); };
  $('#delPhoto').onclick = async () => {
    const old = S.geo.map(p => p.id);
    const gone = S.photos.find(x => x.id === id); if (gone && gone.thumb && gone.thumb.startsWith('blob:')) URL.revokeObjectURL(gone.thumb);
    S.photos = S.photos.filter(x => x.id !== id); await DB.del(id); closeSheet(); Stage.setHover(-1); rebuild(old);
    if (S.filter && !S.photos.some(p => p.region === S.filter)){ S.filter = null; Stage.filter = null; renderUI(); }
  };
}
function closeSheet(){
  $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show'); document.body.style.overflow = ''; sheetId = null;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

/* ───────── 업로드 ───────── */
let toastT = null;
function toast(text, pct, done, busy){
  const el = $('#toast'); clearTimeout(toastT);
  $('#toastTx').textContent = text;
  el.classList.toggle('done', !!done); el.classList.toggle('busy', !!busy);
  $('#ringFg').style.strokeDashoffset = 62.83*(1 - clamp(pct || 0, 0, 1));
  el.classList.add('show');
  if (done) toastT = setTimeout(() => el.classList.remove('show'), text.length > 40 ? 7000 : 3200);
}
const fileId = f => 'p' + [f.name, f.size, f.lastModified].join('|').split('').reduce((h, c) => (h*31 + c.charCodeAt(0)) >>> 0, 7).toString(36) + f.size.toString(36);
const CONC = clamp((navigator.hardwareConcurrency || 4) >> 1, 2, 4);
const Q = {list:[], total:0, done:0, added:0, gps:0, dup:0, bad:0, running:0, ids:new Set(), cancel:false, lastIds:[], timer:null, geoN:0};
let heavyChain = Promise.resolve();
const withHeavy = fn => { const r = heavyChain.then(() => fn()); heavyChain = r.catch(() => {}); return r; };
const isHeavy = f => f.size > 25e6 || RAW_EXT.has(EXT(f)) || /^(heic|heif|hif)$/.test(EXT(f)) || /hei[cf]/i.test(f.type);

function enqueue(files){
  files = [...files].filter(isCandidate);
  if (!files.length){ if (!Q.running) toast('추가할 수 있는 사진이 없습니다', 1, true); return; }
  if (!Q.running && !Q.list.length){
    Object.assign(Q, {total:0, done:0, added:0, gps:0, dup:0, bad:0, cancel:false}); DIAG.errors = []; DIAG.heifFail = false;
    Q.ids = new Set(S.photos.map(p => p.id)); Q.byId = new Map(S.photos.map(p => [p.id, p])); Q.redo = new Set(); Q.fixed = 0; Q.nothumb = 0; Q.lastIds = S.geo.map(p => p.id); Q.geoN = S.geo.length;
    S.fresh = new Set();
  }
  Q.list.push(...files); Q.total += files.length; progress();
  while (Q.running < CONC && Q.list.length) worker();
}
function progress(){ toast(`${Q.done.toLocaleString('ko-KR')} / ${Q.total.toLocaleString('ko-KR')}장 처리 중`, Q.total ? Q.done/Q.total : 0, false, true); }
async function worker(){
  Q.running++;
  while (Q.list.length && !Q.cancel){
    const f = Q.list.shift();
    try{ await processOne(f); }catch(e){ Q.bad++; const msg = (e && (e.message || e.name)) || String(e); DIAG.errors.push(f.name + ': ' + msg); console.error('[Journey] 처리 실패', f.name, e); }
    Q.done++;
    if (!Q.cancel) progress();
    scheduleRefresh();
  }
  Q.running--;
  if (!Q.running) finish();
}
async function processOne(f){
  const id = fileId(f);
  let prev = null;
  if (Q.ids.has(id)){
    prev = Q.byId && Q.byId.get(id);
    // 이전에 위치·썸네일을 못 읽은 사진은 다시 올리면 새로 분석해 교체
    if (!prev || (prev.lat != null && prev.thumb) || Q.redo.has(id)){ Q.dup++; return; }
    Q.redo.add(id);
  }
  Q.ids.add(id);
  const p = await analyze(f, id);
  if (!p){ if (!prev){ Q.bad++; Q.ids.delete(id); DIAG.errors.push(f.name + ': 메타데이터와 이미지 모두 없음'); } else Q.dup++; return; }
  if (prev){
    if (prev.thumb && prev.thumb.startsWith('blob:') && p.thumb !== prev.thumb) URL.revokeObjectURL(prev.thumb);
    S.photos = S.photos.filter(x => x.id !== id); Q.fixed++;
  } else Q.added++;
  S.photos.push(p); S.fresh.add(id); if (p.lat != null) Q.gps++;
  await DB.put(p); scheduleRefresh();
  if (p.pendingThumb){
    const job = () => withTimeout(makeThumb(f, p.orient || 1), 150000);
    const t = await (isHeavy(f) ? withHeavy(job) : job());
    delete p.pendingThumb;
    if (t){ p.thumbBlob = t.blob; p.thumb = URL.createObjectURL(t.blob); if (!p.w || !p.h){ p.w = t.w; p.h = t.h; } delete p.noPreview; } else { p.noPreview = true; Q.nothumb = (Q.nothumb || 0) + 1; }
    await DB.put(p); scheduleRefresh();
  }
}
function scheduleRefresh(){
  if (Q.timer) return;
  Q.timer = setTimeout(() => { Q.timer = null; refresh(); }, Q.total > 200 ? 1200 : 600);
}
function refresh(){
  rebuild(Q.lastIds); Q.lastIds = S.geo.map(p => p.id);
  if (S.geo.length !== Q.geoN){ Q.geoN = S.geo.length; if (!S.filter) Stage.fit(false); }
}
function finish(){
  clearTimeout(Q.timer); Q.timer = null; refresh();
  const parts = [Q.added ? `${Q.added.toLocaleString('ko-KR')}장 추가됨` : (Q.fixed ? '' : '추가된 사진이 없습니다')].filter(Boolean);
  if (Q.fixed) parts.push(`${Q.fixed}장 다시 분석됨`);
  if (Q.added + Q.fixed && Q.gps < Q.added + Q.fixed) parts.push(`위치 없음 ${Q.added + Q.fixed - Q.gps}장`);
  if (Q.dup) parts.push(`중복 ${Q.dup}장 제외`);
  if (Q.nothumb) parts.push(DIAG.heifFail ? `이 브라우저는 HEIC 이미지를 열 수 없어 미리보기 ${Q.nothumb}장 생략 (위치·촬영 정보는 반영됨)` : `미리보기 생성 실패 ${Q.nothumb}장`);
  if (Q.bad) parts.push(`읽을 수 없는 파일 ${Q.bad}개` + (DIAG.errors.length ? ` (${DIAG.errors[DIAG.errors.length - 1]})` : ''));
  if (Q.cancel) parts.push(`${Q.total - Q.done}장 중지됨`);
  toast(parts.join(', '), 1, true);
  if (Q.added || Q.fixed){
    const r = $('#stage').getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) $('#stageSec').scrollIntoView({behavior: reduced ? 'auto' : 'smooth', block:'center'});
  }
  Q.list = []; Q.cancel = false;
  setTimeout(() => { if (!Q.running) S.fresh = new Set(); }, 4000);
}
// 드롭된 폴더까지 재귀로 펼친다 (webkitGetAsEntry는 동기 구간에서 호출해야 함)
function filesFromDrop(dt){
  const entries = [...(dt.items || [])].filter(i => i.kind === 'file').map(i => i.webkitGetAsEntry ? i.webkitGetAsEntry() : null).filter(Boolean);
  const plain = [...(dt.files || [])];
  if (!entries.length || !entries.some(e => e.isDirectory)) return Promise.resolve(plain);
  const out = [];
  const walk = async en => {
    if (en.isFile) await new Promise(r => en.file(f => { out.push(f); r(); }, () => r()));
    else if (en.isDirectory){
      const rd = en.createReader(); let batch;
      do { batch = await new Promise(r => rd.readEntries(r, () => r([]))); for (const e of batch) await walk(e); } while (batch.length);
    }
  };
  return (async () => { for (const e of entries) await walk(e); return out; })();
}

/* ───────── 이벤트 ───────── */
function bindUI(){
  const fi = $('#file');
  const pick = () => fi.click();
  $('#addBtn').onclick = pick;
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = pick);
  fi.onchange = () => { enqueue([...fi.files]); fi.value = ''; };
  const di = $('#dir'), pickDir = () => di.click();
  $('#dirBtn').onclick = pickDir;
  document.querySelectorAll('[data-pick-dir]').forEach(b => b.onclick = pickDir);
  di.onchange = () => { enqueue([...di.files]); di.value = ''; };
  $('#toastStop').onclick = () => { Q.cancel = true; Q.list = []; toast('중지하는 중', 1, false, false); };
  addEventListener('paste', e => { const fs = [...(e.clipboardData && e.clipboardData.files || [])]; if (fs.length){ e.preventDefault(); enqueue(fs); } });

  let depth = 0; const drop = $('#drop');
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; drop.classList.add('show'); });
  addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener('dragleave', e => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) drop.classList.remove('show'); });
  addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; drop.classList.remove('show'); filesFromDrop(e.dataTransfer).then(enqueue); });

  $('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) setFilter(b.dataset.k); });
  $('#clearFilter').onclick = () => { if (S.filter) setFilter(S.filter); };

  const seg = $('#seg'), thumb = seg.querySelector('.thumb');
  const moveThumb = () => { const b = seg.querySelector('[aria-pressed="true"]'); thumb.style.width = b.offsetWidth + 'px'; thumb.style.transform = `translateX(${b.offsetLeft - 4}px)`; };
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); S.view = b.dataset.v; moveThumb(); renderGallery();
  });
  addEventListener('resize', moveThumb); requestAnimationFrame(moveThumb);
  if (document.fonts) document.fonts.ready.then(moveThumb);

  $('#gallery').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openSheet(c.dataset.id); });
  $('#gallery').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')){ e.preventDefault(); openSheet(e.target.dataset.id); } });
  $('#scrim').onclick = closeSheet; $('#closeSheet').onclick = closeSheet;
  addEventListener('keydown', e => { if (e.key === 'Escape' && sheetId) closeSheet(); });

  $('#resetBtn').onclick = async () => {
    if (!S.photos.length) return;
    if (!confirm(`저장된 사진 ${S.photos.length}장과 여정 기록을 모두 삭제합니다.\n삭제한 기록은 되돌릴 수 없습니다.`)) return;
    if (Q.running){ Q.cancel = true; Q.list = []; }
    S.photos.forEach(p => { if (p.thumb && p.thumb.startsWith('blob:')) URL.revokeObjectURL(p.thumb); });
    await DB.clear(); S.photos = []; S.filter = null; Stage.filter = null; Stage.progress = 0; rebuild(); Stage.fit(false);
    toast('모든 기록을 삭제했습니다', 1, true);
  };

  // 유리 하이라이트가 포인터를 따라감
  document.addEventListener('pointermove', e => {
    const g = e.target.closest && e.target.closest('.glass'); if (!g) return;
    const r = g.getBoundingClientRect();
    g.style.setProperty('--mx', (e.clientX - r.left) + 'px'); g.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }, {passive:true});
}

/* ───────── 시작 ───────── */
(async () => {
  Stage.init(); bindUI();
  Sandbox.start();
  WORLD_P = loadWorld().catch(e => { console.warn('[Journey] 세계 지도 불러오기 실패', e); return false; });
  await DB.open();
  S.photos = await DB.all();
  const relabel = async () => {
    const changed = [];
    for (const p of S.photos){ let r; try{ r = p.lat != null ? classify(p.lat, p.lon) : NONE; }catch(e){ continue; } if (r.key !== p.region){ p.region = r.key; changed.push(p); } }
    for (const p of changed) await DB.put(p);
    return changed.length;
  };
  await relabel();
  Stage.progress = 0;
  rebuild();
  Stage.fit(true);
  if (await WORLD_P){
    if (await relabel()){
      if (S.filter && !S.photos.some(p => p.region === S.filter)){ S.filter = null; Stage.filter = null; }
      rebuild(S.geo.map(p => p.id));
    }
  }
})();
})();
</script>
